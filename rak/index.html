<style>
  :root{--navy:#1d2088;--navy2:#2276b5;--red:#e60013;--ink:#1d1f2b;--sub:#6b6f80;--line:#e6e7ef;--bg:#f2f3f8}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;justify-content:center;padding:24px 16px 40px}
  .card{width:100%;max-width:420px;background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 10px 30px rgba(29,32,136,.12)}
  .head{position:relative;padding:34px 24px 26px;text-align:center;background:#fff;border-bottom:1px solid var(--line)}
  .head::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:6px;background:var(--navy)}
  .logo{width:120px;margin:0 auto 6px}
  .logo svg{display:block;width:100%;height:auto}
  .en{font-size:12px;font-weight:700;color:var(--navy2);letter-spacing:.04em;margin-bottom:14px}
  .company{font-size:22px;font-weight:700;color:var(--navy);letter-spacing:-.01em}
  .person{padding:26px 24px 8px;text-align:center}
  .role{display:inline-block;font-size:12px;font-weight:700;color:var(--navy);background:#eceefa;padding:4px 12px;border-radius:999px;margin-bottom:10px}
  .name{font-size:30px;font-weight:700;letter-spacing:.35em;margin-right:-.35em}
  .mobile{margin-top:6px;font-size:17px;font-weight:500;color:var(--sub);letter-spacing:.02em}
  .actions{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:22px 20px 6px}
  .act{display:flex;flex-direction:column;align-items:center;gap:7px;text-decoration:none;color:var(--ink);font-size:12px;font-weight:500}
  .act .ic{width:52px;height:52px;border-radius:16px;background:var(--navy);display:flex;align-items:center;justify-content:center;transition:transform .15s}
  .act:active .ic{transform:scale(.93)}
  .act svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .info{margin:18px 20px 0;border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .info h3{font-size:12px;font-weight:700;color:var(--navy);padding:14px 16px 4px;letter-spacing:.08em}
  .row{display:flex;gap:12px;align-items:flex-start;padding:11px 16px;border-top:1px solid var(--line)}
  .info h3+.row{border-top:none}
  .row svg{flex:none;width:18px;height:18px;margin-top:2px;fill:none;stroke:var(--navy2);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .row .t{flex:1;font-size:14px;line-height:1.5}
  .row .t small{display:block;font-size:12px;color:var(--sub)}
  .row .lbl{display:block;font-size:11px;color:var(--sub)}
  .row a{color:inherit;text-decoration:none}
  .save{display:block;width:calc(100% - 40px);margin:18px 20px 0;padding:15px;border:none;border-radius:14px;background:linear-gradient(90deg,var(--navy),var(--navy2));color:#fff;font:700 15px 'Noto Sans KR',sans-serif;cursor:pointer}
  .copy{display:block;margin:12px auto 0;background:none;border:none;color:var(--sub);font:500 13px 'Noto Sans KR',sans-serif;text-decoration:underline;cursor:pointer}
  .foot{padding:18px 20px 24px;text-align:center;font-size:11px;color:#a0a3b1}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:rgba(29,31,43,.92);color:#fff;font-size:13px;padding:10px 18px;border-radius:999px;opacity:0;transition:.25s;pointer-events:none}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
